name: Streamlit Keepalive

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    timeout-minutes: 15

    steps:
      - name: Install Playwright package
        run: |
          npm install --no-save playwright@1.63.0

      - name: Wake Streamlit
        env:
          STREAMLIT_URL: https://l2uetmksgajvryi4qmegvn.streamlit.app/
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const url = process.env.STREAMLIT_URL;

            if (!url) {
              throw new Error('STREAMLIT_URL is not set');
            }

            console.log(`Opening: ${url}`);

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              viewport: {
                width: 1280,
                height: 720
              }
            });

            const page = await context.newPage();

            // Reduce unnecessary traffic.
            await page.route('**/*', async route => {
              const type = route.request().resourceType();

              if (
                type === 'image' ||
                type === 'font' ||
                type === 'media'
              ) {
                await route.abort();
              } else {
                await route.continue();
              }
            });

            try {
              console.log('Loading Streamlit...');

              await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });

              console.log(`Title: ${await page.title()}`);

              // Allow Streamlit frontend to initialize.
              await page.waitForTimeout(5000);

              const wakeButton = page.getByText(
                'Yes, get this app back up!',
                { exact: false }
              );

              const count = await wakeButton.count();

              console.log(`Wake button count: ${count}`);

              if (count > 0) {
                console.log('Streamlit is sleeping.');

                await wakeButton.first().click();

                console.log('Wake button clicked.');

                // Wait for cold start.
                await page.waitForTimeout(60000);

                console.log('Cold start wait completed.');
              } else {
                console.log(
                  'Wake button not found. Streamlit may already be running.'
                );
              }

              console.log(`Final URL: ${page.url()}`);

              const bodyText = await page
                .locator('body')
                .innerText({ timeout: 30000 })
                .catch(() => '');

              console.log(`Page text length: ${bodyText.length}`);

              console.log('Streamlit Keepalive completed.');

            } catch (error) {
              console.error('Keepalive failed:');
              console.error(error);
              process.exitCode = 1;

            } finally {
              await context.close().catch(() => {});
              await browser.close().catch(() => {});
            }
          })();
          EOF
```
