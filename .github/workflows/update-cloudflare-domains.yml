name: Update Cloudflare Preferred Domains

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch and merge
        run: |
          mkdir -p tmp
          : > IP

          # 域名
          curl -fsSL https://vps789.com/openApi/cfIpTop20 \
            | jq -r '.data.good[].ip' \
            | grep -vP '^\d+\.\d+\.\d+\.\d+$' > tmp/02-vps789-domain.txt || true

          curl -fsSL https://www.wetest.vip/page/cloudflare/cname.html \
            | grep -oP '(?<=<td data-label="地址名称">)[^<]+' \
            | sed 's/^\*/bestcf/' > tmp/04-wetest-domain.txt || true

          # 运营商 IP
          curl -fsSL https://vps789.com/openApi/cfIpApi | jq -r '.data.CM[].ip' > tmp/cmcc-ip.txt || true
          curl -fsSL https://vps789.com/openApi/cfIpApi | jq -r '.data.CU[].ip' > tmp/cucc-ip.txt || true
          curl -fsSL https://vps789.com/openApi/cfIpApi | jq -r '.data.CT[].ip' > tmp/ctcc-ip.txt || true

          # 最佳 IP
          curl -fsSL https://vps789.com/openApi/cfIpTop20 \
            | jq -r '.data.good[].ip' \
            | grep -P '^\d+\.\d+\.\d+\.\d+$' \
            | head -n 5 > tmp/bestcf-ip.txt || true

          # 统一格式：地址#地址
          for f in tmp/*.txt; do
            [ -f "$f" ] || continue
            sed 's/[[:space:]]//g' "$f" \
              | grep -v '^$' \
              | awk -F'#' '{print $1 "#" $1}' \
              | awk '!a[$0]++' \
              | head -n 3 >> IP
          done

          # 全局去重
          awk '!a[$0]++' IP > IP.tmp
          mv IP.tmp IP
          rm -rf tmp

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if ! git diff --quiet -- IP; then
            git add IP
            git commit -m "Update Cloudflare preferred domains ($(date +'%Y-%m-%d'))"
            git push
          else
            echo "IP 文件没有变化"
          fi
